##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .*
}


# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


windowrule {
  name = windowrule-3
  float = on
  match:title = (ネットワーク接続)
}

windowrule {
  name = windowrule-4
  float = on
  match:title = (Pipewire Volume Control)
}

windowrule {
  name = windowrule-5
  float = on
  size = (monitor_w*0.3) (monitor_h*0.77)
  match:title = (音量調節)
}

windowrule {
  name = windowrule-6
  float = on
  size = (monitor_w*0.66) (monitor_h*0.44)
  match:title = (ranger)
}

#windowrulev2 = float, size 66% 66%, class:(org.kde.dolphin)
windowrule {
  name = windowrule-7
  size = (monitor_w*0.2) (monitor_h*1)
  match:title = (foot) # make it small so that i can pseudo it if its the only thing on the workspace
}

windowrule {
  name = windowrule-8
  float = on
  size = (monitor_w*0.2) (monitor_h*0.04)
  match:title = (ytdrag)
}

windowrule {
  name = windowrule-9
  float = on
  persistent_size = on
  match:class = (qimgv)
}

windowrule {
  name = windowrule-10
  float = on
  pin = on
  #exclusive = yes
  center = on
  #size = (monitor_w*0.08) (monitor_h*0.3)
  size =  450 450
  match:title = (quickshell_blob)
}

windowrule {
    name = qbittorrent
    float = on
    match:initial_class = (org.qbittorrent.qBittorrent)
    }

#windowrulev2 = workspace 1, initialTitle:(Discord)
windowrule {
  name = windowrule-11
  border_size = 0
  match:workspace = w[t1]
}


# workspace = 2,monitor:DP-3
# workspace = 1, monitor:DP-2

plugin:dynamic-cursors {

    # enables the plugin
    enabled = true

    # sets the cursor behaviour, supports these values:
    # tilt    - tilt the cursor based on x-velocity
    # rotate  - rotate the cursor based on movement direction
    # stretch - stretch the cursor shape based on direction and velocity
    # none    - do not change the cursors behaviour
    mode = stretch

    # minimum angle difference in degrees after which the shape is changed
    # smaller values are smoother, but more expensive for hw cursors
    threshold = 2

    shake {
        enabled = false
    }
}

