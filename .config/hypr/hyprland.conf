################
### MONITORS ###
################
#exec-once = xrandr --setprovideroutputsource modesetting NVIDIA-0
exec-once = xrandr --auto
# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=HDMI-A-1,2560x1440@144,auto-right,1
#monitor=eDP-1,2560x1440@240,0x0,1
#monitor=eDP-1,disable
monitor=DP-3,2560x1440@143.96Hz,2560x0,1
monitor=DP-2,2560x1440@144.00Hz,0x0,1

bind = WIN, F5, dpms, toggle

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = foot
#$fileManager = foot --title=ranger ranger
$fileManager = dolphin

$menu = wofi --show drun
$browser = firefox

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = otp-daemon
exec-once = quickshell & hyprpaper & dunst
exec-once = systemctl --user start hyprpolkitagent

# audio
exec-once = ~/scripts/sinks.sh
exec-once = qpwgraph

#cliphist
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data

exec-once = fcitx5
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6

exec-once= dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

exec-once = vopono -v exec --custom-netns-name QBIT --provider custom --custom /etc/wireguard/d4rkness-porting-NO-42.conf --protocol wireguard --custom-port-forwarding protonvpn --port-forwarding-callback ~/scripts/qbitport.sh qbittorrent

exec-once = sudo quadcastrgb solid 110000

# cursor
exec-once = hyprctl setcursor miku-cursor 32
exec-once = hyprpm reload

# clipping
exec-once = obs --startreplaybuffer --minimize-to-tray --disable-shutdown-check
