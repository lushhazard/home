###################
### KEYBINDINGS ###
###################

binds {
    scroll_event_delay = 0
}

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more

# USED KEYS:
# ABCDEFGHIJKLMNOPQRSTUVWXYZ
# -BCDEF-H-JKLM--PQRS--V---Z

# <space><print><backspace><scroll><f1>

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, hyprlock
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, space, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, B, exec, $browser # dwindle
bind = $mainMod, D, exec, hyprctl notify -1 2000 "rgb(ab1eff)" "$(date)"
bind = $mainMod SHIFT, D, exec, discord
bind = $mainMod SHIFT, S, exec, steam
bind = $mainMod,S,pass,class:^(com\.obsproject\.Studio)$
bind = $mainMod,T,pin


bind = $mainMod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

bind = $mainMod, Z, exec, google-chrome-stable --app=https://game.mahjongsoul.com/

#bind = , PRINT, exec, hyprshot -m region
bind = , PRINT, exec, hyprshot -m active -m output --clipboard-only --raw | satty --font-family 'Noto Sans CJK JP' --copy-command 'wl-copy' --actions-on-enter save-to-clipboard -f -
#bind = , PRINT, exec, hyprshot -m active -m output --raw | swappy -f -
bind = SHIFT, PRINT, exec, hyprshot -m window

bind = $mainMod, PRINT , exec, echo 2 | wf-recorder -a -r 60 -g "0,0 0x0" -f ~/rec/recording_$(date +"%Y-%m-%d_%H:%M:%S.mp4") & hyprctl notify -1 3000 "rgb(ffff22)" "画面の録画を開始しました"
bind = $mainMod CTRL, PRINT, exec, wf-recorder -a -r 60 -g "$(slurp)" -f ~/rec/recording_$(date +"%Y-%m-%d_%H:%M:%S.mp4") & hyprctl notify -1 3000 "rgb(ffff22)" "画面の一部の録画を開始しました"
bind = $mainMod, BACKSPACE, exec, killall -s SIGINT wf-recorder & hyprctl notify -1 3000 "rgb(33ff77)" "録画を停止しました"

bind = $mainMod, F, fullscreen

# zooming
binde = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 1.1}')
binde = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | awk '/^float.*/ {print $2 * 0.9}')

bind = $mainMod SHIFT, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor 1
bind = $mainMod SHIFT, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor 1


# bind = $mainMod SHIFT, F, fullscreen, 1
#
# GAMEMODE!!!
#
bind = WIN, F1, exec, ~/.config/hypr/gamemode.sh

# Move focus with mainMod + arrow keys
# and vim bindings lol
bind = $mainMod, left, movefocus, l
bind = $mainMod, H, movefocus, l
bind = $mainMod, down, movefocus, d
bind = $mainMod, J, movefocus, d
bind = $mainMod, up, movefocus, u
bind = $mainMod, K, movefocus, u
bind = $mainMod, right, movefocus, r
bind = $mainMod, L, movefocus, r

# Resizing windows
bind = $mainMod CTRL, left, resizeactive, -60 0
bind = $mainMod CTRL, H, resizeactive, -60 0
bind = $mainMod CTRL, down, resizeactive, 0 60
bind = $mainMod CTRL, J, resizeactive, 0 60
bind = $mainMod CTRL, up, resizeactive, 0 -60
bind = $mainMod CTRL, K, resizeactive, 0 -60
bind = $mainMod CTRL, right, resizeactive, 60 0
bind = $mainMod CTRL, L, resizeactive, 60 0

# Moving windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, L, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Window rules floating modules
windowrulev2 = float, title:(ネットワーク接続)
windowrulev2 = float, title:(Pipewire Volume Control)
windowrulev2 = float, title:(音量調節)
windowrulev2 = size 30% 77%, title:(音量調節)
#ranger file manager thing
windowrulev2 = float, title:(ranger)
windowrulev2 = size 66% 44%, title:(ranger)
#dolphin file manager
#windowrulev2 = float, class:(org.kde.dolphin)
#windowrulev2 = size 66% 66%, class:(org.kde.dolphin)


windowrulev2 = float, class:(qimgv)
windowrulev2 = persistentsize, title:(qimgv)

#windowrulev2 = workspace 1, initialTitle:(Discord)


workspace = 2,monitor:DP-3
workspace = 1, monitor:DP-2

plugin:dynamic-cursors {

    # enables the plugin
    enabled = true

    # sets the cursor behaviour, supports these values:
    # tilt    - tilt the cursor based on x-velocity
    # rotate  - rotate the cursor based on movement direction
    # stretch - stretch the cursor shape based on direction and velocity
    # none    - do not change the cursors behaviour
    mode = stretch

    # minimum angle difference in degrees after which the shape is changed
    # smaller values are smoother, but more expensive for hw cursors
    threshold = 2

    shake {
        enabled = false
    }
}

