$accent = $mauve
$accentAlpha = $mauveAlpha
$font_sans = Noto Sans CJK JP
$font_serif = Noto Serif CJK JP
$white = rgb(255,255,255) 
$black = rgb(0,0,0)
$red = rgb(255,0,0)
$accent = rgb(100,100,100)
$surface = rgb(20,20,20)

$text = $white

# GENERAL
general {
  disable_loading_bar = true
  hide_cursor = true
}

# BACKGROUND
background {
  monitor = 
  path = screenshot
  blur_passes = 3
  noise = 0.05
  vibrancy = 0.4
  contrast = 1
  brightness = 0.2
}

