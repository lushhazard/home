# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 90
  font_family = $font_sans
  position = -30, 0
  halign = right
  valign = top
  shadow_passes = 1
  shadow_color = rgb(255,255,255)
  shadow_boost = 0.5
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%Y年%B%e日（%a）"
  color = $text
  font_size = 25
  font_family = $font_sans
  position = -30, -150
  halign = right
  valign = top
#
  shadow_passes = 1
  shadow_color = rgb(255,255,255)
  shadow_boost = 0.5
}

# fortune
label {
  text = cmd[update:0] fortune

  color = $text
  font_family = $font_serif

  position = 0, 150

  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 1
  shadow_color = rgb(255,255,255)
  shadow_boost = 0.5
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface
  font_color = $text
  font_family = $font_serif
  fade_on_empty = false
  placeholder_text = 入力して下さい
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -200
  halign = center
  valign = center
  shadow_passes = 2
  shadow_size = 4
  shadow_boost = 1
}
