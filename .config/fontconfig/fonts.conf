<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <!-- Keep JetBrainsMonoNF as primary -->
    <match>
        <test name="family">
            <string>JetBrainsMonoNF</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Noto Sans CJK JP</string>  <!-- Change this to another font if needed -->
        </edit>
    </match>
</fontconfig>
